[package]
name = "tb_realms"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "=0.4.16"
macroquad-toolkit = { path = "../macroquad-toolkit", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The world this exchange prices (GDD 5.1). Cross-workspace path dependencies:
# `mytherra/` is its own Cargo workspace, excluded from the RustGames root, and
# both crates resolve cleanly from here because they already share this game's
# `macroquad-toolkit` path, so Cargo unifies to one copy. Strictly read-only —
# `mytherra-protocol::PlayerAction` is deliberately never constructed here.
mytherra-core = { path = "../mytherra/mytherra-core" }
mytherra-protocol = { path = "../mytherra/mytherra-protocol" }
